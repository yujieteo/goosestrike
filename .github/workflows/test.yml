name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: astral-sh/setup-uv@v6
      # lavapipe, a Vulkan driver on the CPU, gives Dawn a WebGPU adapter
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 clang
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          GOOSESTRIKE_GPU: 1
